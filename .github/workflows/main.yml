name: FloodGuard CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  AWS_REGION: "us-east-1"
  INGESTION_FUNCTION: "floodguard-ingestion"
  QUERY_FUNCTION: "floodguard-query"
  API_BASE_URL: "https://igsjnvt205.execute-api.us-east-1.amazonaws.com"

jobs:
  quality:
    name: Tests, Coverage and SonarCloud
    runs-on: ubuntu-latest

    env:
      # Fake credentials are used only by moto/boto3 during automated tests.
      AWS_ACCESS_KEY_ID: "testing"
      AWS_SECRET_ACCESS_KEY: "testing"
      AWS_SECURITY_TOKEN: "testing"
      AWS_SESSION_TOKEN: "testing"
      AWS_DEFAULT_REGION: "us-east-1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=backend \
            --cov=device_simulator \
            --cov=fog_app \
            --cov=shared \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,device_simulator,fog_app,shared,dashboard
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=tests/**,dashboard/**

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: AWS deployment
    runs-on: ubuntu-latest
    needs: quality

    # Deploy automatically after successful CI on main, or manually when requested.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Package Lambda functions
        run: python infrastructure/package_lambdas.py

      - name: Deploy ingestion Lambda
        run: |
          aws lambda update-function-code  \
            --function-name "${INGESTION_FUNCTION}" \
            --zip-file fileb://infrastructure/floodguard-ingestion-lambda.zip \
            --region "${AWS_REGION}"

          aws lambda wait function-updated \
            --function-name "${INGESTION_FUNCTION}" \
            --region "${AWS_REGION}"

      - name: Deploy query Lambda
        run: |
          aws lambda update-function-code \
          --function-name "${QUERY_FUNCTION}" \
          --zip-file fileb://infrastructure/floodguard-query-lambda.zip \
          --region "${AWS_REGION}"

          aws lambda wait function-updated \
            --function-name "${QUERY_FUNCTION}" \
            --region "${AWS_REGION}"

      - name: Deploy dashboard to S3
        run: |
          aws s3 sync dashboard/ \
          "s3://${{ vars.DASHBOARD_BUCKET }}" \
          --delete \
          --region "${AWS_REGION}"

      - name: Verify public API
        run: |
          curl --fail \
          --retry 5 \
          --retry-delay 5 \
          "${API_BASE_URL}/health"

      - name: Deployment summary
        run: |
          echo "Lambda functions updated successfully."
          echo "Dashboard bucket: ${{ vars.DASHBOARD_BUCKET }}"
          echo "Dashboard URL: http://${{ vars.DASHBOARD_BUCKET }}.s3-website-${AWS_REGION}.amazonaws.com"
